<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"/><link rel="stylesheet" href="_shared.css"/>
<style>.s{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--rule-hairline)}.t{font-family:var(--font-mono);font-size:11px;color:var(--ink-tertiary);width:100px}.b{height:10px;background:var(--accent-vermillion-soft);border:1px solid var(--accent-vermillion)}</style></head>
<body><div class="card-frame">
<div class="s"><span class="t">--space-2 · 8</span><span class="b" style="width:8px"></span></div>
<div class="s"><span class="t">--space-4 · 16</span><span class="b" style="width:16px"></span></div>
<div class="s"><span class="t">--space-6 · 24</span><span class="b" style="width:24px"></span></div>
<div class="s"><span class="t">--space-8 · 32</span><span class="b" style="width:32px"></span></div>
<div class="s"><span class="t">--space-12 · 48</span><span class="b" style="width:48px"></span></div>
<div class="s"><span class="t">--space-16 · 64</span><span class="b" style="width:64px"></span></div>
<div style="display:flex;gap:12px;margin-top:14px">
<div><div style="width:48px;height:48px;background:var(--accent-vermillion-soft);border:1px solid var(--accent-vermillion);border-radius:0"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-tertiary);margin-top:4px">none · 0</div></div>
<div><div style="width:48px;height:48px;background:var(--accent-vermillion-soft);border:1px solid var(--accent-vermillion);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-tertiary);margin-top:4px">sm · 2px</div></div>
<div><div style="width:48px;height:48px;background:var(--accent-vermillion-soft);border:1px solid var(--accent-vermillion);border-radius:4px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-tertiary);margin-top:4px">md · 4px</div></div>
<div><div style="width:48px;height:48px;background:var(--accent-vermillion-soft);border:1px solid var(--accent-vermillion);border-radius:6px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-tertiary);margin-top:4px">lg · 6px</div></div>
</div>
</div></body></html>
